    if (e.target.closest('#btn-board-home')) { leaveBoard(); return; }
  });
  el.screens.board.addEventListener('submit', (e) => { e.preventDefault(); submitBoardCode(); });
  // Lien #r=… ou #board ouvert alors que l'app est déjà affichée dans l'onglet (ou lien du pied d'accueil)
  window.addEventListener('hashchange', () => { if (/^#(r|board)(=|$)/.test(location.hash)) route(); });
}
function init() {
  checkPieces();
  renderHome();
  wireStatic();
  if (progress) enterGameChrome();
  route();
}
init();

/* ======================================================================
   TODO: REMOVE — HELPER DEV : navigation libre entre les étapes
   Panneau flottant (en haut à droite) pour sauter à n'importe quel écran
   sans jouer : accueil, chaque salle (avant / après résolution), accusation,
   résultat juste / faux, classement final. « Solve » remplit la bonne
   réponse de la salle courante et la soumet. « Wipe » efface toutes les clés
   chateau.* du localStorage et recharge. Raccourcis : Alt+← / Alt+→ pour
   changer d'étape, Alt+Entrée pour résoudre. Console : DEV.goTo('room-2'),
   DEV.solve(), DEV.steps. Tout est contenu dans ce bloc (styles compris) :
   le supprimer d'un seul tenant avant l'événement.
   ====================================================================== */
const DEV = (() => {
  const roomIndex = () => (progress.revealPending ? progress.solved - 1 : progress.solved);
  // Garantit une partie en cours (nom saisi sur l'accueil, sinon « Dev team ») et quitte un éventuel #board
  const ensureGame = () => {
    if (!progress) {
      progress = { team: el.teamInput.value.trim() || 'Dev team', crest: { ...homeCrest }, startedAt: Date.now(), finishedAt: null, solved: 0, hints: {}, revealPending: false, result: null };
      cardState = {}; persist(KEY.cards, cardState);
    }
    progress.finishedAt = null; progress.result = null;
    history.replaceState(null, '', pageUrl());
    enterGameChrome();
  };
  const goHome = () => { history.replaceState(null, '', pageUrl()); clearGame(); };
  const goRoom = (index, solved) => {
    ensureGame();
    progress.solved = solved ? index + 1 : index;
    progress.revealPending = solved;
    persist(KEY.progress, progress);
    renderNotebook(); updateBadge();
    route();
  };
  const goAccusation = () => goRoom(rooms.length, false);
  // Accusation bâtie sur les cartes isSolution (juste) ou juste à côté (fausse).
  // Tant qu'une arme et une pièce n'ont pas isSolution: true, « correct » restera faux (voir finishGame).
  const goResult = (correct) => {
    goAccusation();
    const accusation = Object.fromEntries(AXES.map((ax) => {
      const sol = solutionOf(ax);
      return [ax.key, (correct ? sol || ax.list[0] : ax.list.find((c) => c !== sol)).id];
    }));
    finishGame(accusation);
  };
  const goBoard = () => { if (location.hash === '#board') route(); else location.hash = '#board'; };
  const solve = () => {
    const input = $('#answer-input'), form = $('#answer-form');
    if (!progress || !input || !form) return;
    input.value = rooms[roomIndex()]?.answers?.[0] ?? '';
    form.requestSubmit();
  };
  const wipe = () => {
    Object.keys(localStorage).filter((k) => k.startsWith(CONFIG.storagePrefix)).forEach((k) => localStorage.removeItem(k));
    location.replace(pageUrl());
  };

  const steps = [
    { id: 'home', label: 'Home', go: goHome },
    ...rooms.flatMap((r, i) => [
      { id: `room-${i}`, label: `${i + 1}. ${r.name}`, go: () => goRoom(i, false) },
      { id: `room-${i}-solved`, label: `${i + 1}. ${r.name} · solved`, go: () => goRoom(i, true) },
    ]),
    { id: 'accusation', label: 'Accusation', go: goAccusation },
    { id: 'result-ok', label: 'Result · correct', go: () => goResult(true) },
    { id: 'result-ko', label: 'Result · wrong', go: () => goResult(false) },
    { id: 'board', label: 'Board', go: goBoard },
  ];
  // Étape courante déduite de l'état, pas du DOM
  const currentId = () => {
    if (/^#board/.test(location.hash)) return 'board';
    if (!progress) return 'home';
    if (progress.finishedAt) return progress.result?.correct ? 'result-ok' : 'result-ko';
    if (progress.solved >= rooms.length && !progress.revealPending) return 'accusation';
    return `room-${roomIndex()}${progress.revealPending ? '-solved' : ''}`;
  };
  const goTo = (id) => steps.find((s) => s.id === id)?.go();
  const shift = (delta) => {
    const i = steps.findIndex((s) => s.id === currentId());
    goTo(steps[Math.max(0, Math.min(steps.length - 1, i + delta))].id);
  };

  // Panneau : styles injectés + <aside> ajouté au body
  document.head.insertAdjacentHTML('beforeend', `<style id="dev-style">
    .dev { position: fixed; top: 6px; right: 6px; z-index: 9999; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; max-width: calc(100vw - 12px); padding: 4px; background: #111; color: #ffd400; border: 2px dashed #ffd400; border-radius: 8px; font: 12px/1 ui-monospace, Menlo, monospace; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .dev button, .dev select { font: inherit; color: #ffd400; background: #222; border: 1px solid #555; border-radius: 4px; padding: 5px 7px; cursor: pointer; max-width: 44vw; }
    .dev button:hover, .dev select:hover { background: #333; }
    .dev__toggle { font-weight: 700; }
    .dev.is-collapsed > :not(.dev__toggle) { display: none; }
  </style>`);
  const panel = document.createElement('aside');
  panel.className = 'dev'; panel.id = 'dev-helper'; panel.setAttribute('aria-label', 'Dev helper');
  panel.innerHTML = `
    <button type="button" class="dev__toggle" data-dev="toggle" title="Show / hide the dev helper">DEV</button>
    <button type="button" data-dev="prev" title="Previous step (Alt+←)">◀</button>
    <select data-dev="step" aria-label="Step">${steps.map((s) => `<option value="${s.id}">${esc(s.label)}</option>`).join('')}</select>
    <button type="button" data-dev="next" title="Next step (Alt+→)">▶</button>
    <button type="button" data-dev="solve" title="Fill the right answer and submit (Alt+Enter)">Solve</button>
    <button type="button" data-dev="wipe" title="Clear every chateau.* key in localStorage and reload">Wipe</button>`;
  document.body.appendChild(panel);
  const select = panel.querySelector('[data-dev="step"]');
  const sync = () => { select.value = currentId(); };
  const actions = {
    toggle: () => { panel.classList.toggle('is-collapsed'); sessionStorage.setItem('chateau.dev', panel.classList.contains('is-collapsed') ? '1' : ''); },
    prev: () => shift(-1), next: () => shift(1), solve, wipe,
  };
  panel.addEventListener('click', (e) => { const a = e.target.closest('[data-dev]')?.dataset.dev; if (actions[a]) { actions[a](); sync(); } });
  select.addEventListener('change', () => { goTo(select.value); sync(); });
  if (sessionStorage.getItem('chateau.dev')) panel.classList.add('is-collapsed');
  // Suit les changements d'écran faits par l'app elle-même (réponse soumise, accusation…)
  let raf = 0;
  new MutationObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(sync); })
    .observe(el.main, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden'] });
  window.addEventListener('hashchange', sync);
  document.addEventListener('keydown', (e) => {
    if (!e.altKey || e.ctrlKey || e.metaKey || e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); shift(-1); sync(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); shift(1); sync(); }
    else if (e.key === 'Enter') { e.preventDefault(); solve(); }
  });
  sync();
  return { steps, goTo, solve, wipe };
})();
window.DEV = DEV;
/* TODO: REMOVE — fin du helper dev ====================================== */
})();
</script>
</body>
